# Cross-space link sentinels.
#
# Markdown links that cross a space boundary are written as
#   https://app.gitbook.com/s/XSPACE_<KEY>/<path>
# because real space ids do not exist until GitBook creates the spaces on the
# first Git Sync merge.
#
# After that first merge, read the ids back with:
#   GET /v1/orgs/{orgId}/sites/{siteId}/structure
# fill them in below, run scripts/resolve-cross-space-links.sh, and push again.
#
# This is the documented two-merge rollout for structure-as-code.

site: site_gP85b   # Paysafe Developer Portal (Git-Synced)

spaces:
  XSPACE_HOME: "VQHBBY7AKKsm5pK8l7Ix"        # home/          — section "Home"
  XSPACE_APIS: "YjnAGVmcGiEiZme2Neu4"        # apis-and-sdks/ — section "APIs & SDKs"
  XSPACE_SUPPORT: "s32UcT9FwtQGR4UN7RvJ"     # support/       — section "Support & Resources"
  XSPACE_CHANGELOG: "mH0d2WOfwPMJtdaq2oGk"   # changelog/     — section "Changelog"
